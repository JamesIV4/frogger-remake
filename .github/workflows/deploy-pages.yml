# Deploys the Godot 4.7 Web export to GitHub Pages for phone testing.
#
# Trigger: every push to main, plus a manual "Run workflow" button.
# Result: https://<owner>.github.io/<repo>/  (enable Pages: Settings ->
# Pages -> Source: "GitHub Actions").
#
# How CI gets a ROM: a fresh runner has no reference/frogger.zip (git-ignored
# on purpose). Provide it as a base64 Actions secret named FROGGER_ZIP_B64:
#
#   [Windows]  certutil -encode reference\frogger.zip reference\frogger.txt
#   [mac/Linux] base64 -w0 reference/frogger.zip > fz.b64
#
#   The step below normalises whatever you paste: it creates the git-ignored
#   reference/ directory, strips certutil's -----BEGIN/END CERTIFICATE-----
#   wrapper and CRLF endings, and joins everything to a single line. So both
#   the raw multi-line certutil file and a pre-joined one-liner work. A
#   ~22 KB value is fine (GitHub's secret limit is 48 KB).
#
#   Repo -> Settings -> Secrets and variables -> Actions -> New repository
#   secret:  Name = FROGGER_ZIP_B64, Value = <the file contents>
#
# The workflow decodes the secret to reference/frogger.zip, runs
# tools/prepare_rom.py (which verifies SHA-256 checksums before producing
# godot/rom/*.bin), then builds and exports. If the secret is absent the job
# fails with a clear message instead of producing a ROM-less build.
#
# Toolchain pins (must match local builds):
#   Godot 4.7 stable (Standard, non-.NET) + 4.7 export templates.
#   Emscripten 4.0.20 — required by AGENTS.md for the SIDE_MODULE wasm build
#     (-sSIDE_MODULE=1 -sWASM_BIGINT -sSUPPORT_LONGJMP=wasm).
#   godot-cpp at tag 10.0.0-stable (api_version=4.7), i.e. the same commit you
#   have vendored under src/godot-cpp (which is git-ignored, so CI clones it).
#
# Threads + Pages note: this workflow builds the THREADED variant
# (variant/thread_support=true, godot-cpp threads=yes, em++ -pthread).
# That normally needs COOP/COEP response headers, which GitHub Pages cannot
# send. Browsers do honour those headers when a Service Worker supplies them,
# so the export step turns on Godot's built-in PWA cross-origin isolation
# (progressive_web_app/enabled plus
# progressive_web_app/ensure_cross_origin_isolation_headers) to emit one.
# Consequences to expect: a visitor's FIRST load self-reloads once, and the
# worker caches aggressively (Godot's docs note it has no automated cache
# busting, so a pushed build can linger).
#
# Your local build is deliberately unaffected: both options are set by sed in
# CI and reverted right after the export, so BuildWeb.ps1 stays free of the
# service worker and keeps relying on the real headers that
# tools/serve_web.py serves (see RunWeb.ps1).

name: Deploy Web to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  GODOT_VERSION: 4.7-stable
  EMSCRIPTEN_VERSION: 4.0.20
  GODOT_CPP_TAG: 10.0.0-stable

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore ROM from secret
        shell: bash
        env:
          FROGGER_ZIP_B64: ${{ secrets.FROGGER_ZIP_B64 }}
        run: |
          set -euo pipefail
          if [ -z "${FROGGER_ZIP_B64:-}" ]; then
            echo "::error::FROGGER_ZIP_B64 secret is not set. See .github/workflows/deploy-pages.yml header for setup."
            exit 1
          fi
          # /reference is fully git-ignored and has no tracked files, so a fresh
          # checkout has no reference/ directory at all -> the redirect below
          # would fail with "No such file or directory". Create it first.
          mkdir -p reference
          # Normalise to a single bare line: certutil writes CRLF endings (GNU
          # base64 -d rejects a stray CR), and drop the PEM-style
          # -----BEGIN/END CERTIFICATE----- wrapper if it was pasted along.
          printf '%s' "$FROGGER_ZIP_B64" \
            | tr -d '\r' \
            | sed -e '/-----BEGIN CERTIFICATE-----/d' -e '/-----END CERTIFICATE-----/d' \
            | tr -d '\n \t' \
            | base64 -d > reference/frogger.zip
          python3 -c "import zipfile;print('restored', len(zipfile.ZipFile('reference/frogger.zip').namelist()), 'entries from secret')"
          python3 tools/prepare_rom.py

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install SCons
        run: pip install scons

      - name: Cache Emscripten
        id: emsdk-cache
        uses: actions/cache@v4
        with:
          path: emsdk-cache
          key: emsdk-${{ env.EMSCRIPTEN_VERSION }}-ubuntu-latest

      - name: Setup Emscripten
        uses: emscripten-core/setup-emsdk@v15
        with:
          version: ${{ env.EMSCRIPTEN_VERSION }}
          actions-cache-folder: emsdk-cache

      - name: Clone godot-cpp (git-ignored locally)
        run: |
          rm -rf src/godot-cpp
          git clone --depth 1 --branch "${{ env.GODOT_CPP_TAG }}" https://github.com/godotengine/godot-cpp.git src/godot-cpp

      - name: Download Godot 4.7 headless + export templates
        run: |
          mkdir -p $HOME/godot $HOME/.local/share/godot/export_templates
          BASE="https://github.com/godotengine/godot/releases/download/${{ env.GODOT_VERSION }}"
          curl -fL -o /tmp/godot.zip "$BASE/Godot_v4.7-stable_linux.x86_64.zip"
          curl -fL -o /tmp/templates.tpz "$BASE/Godot_v4.7-stable_export_templates.tpz"
          unzip -q -o /tmp/godot.zip -d $HOME/godot
          mkdir -p "$HOME/.local/share/godot/export_templates/4.7.stable"
          unzip -q -o /tmp/templates.tpz -d "$HOME/.local/share/godot/export_templates/4.7.stable"
          mv "$HOME/.local/share/godot/export_templates/4.7.stable/templates/"* \
             "$HOME/.local/share/godot/export_templates/4.7.stable/" 2>/dev/null || true
          ls "$HOME/.local/share/godot/export_templates/4.7.stable"
          echo "$HOME/godot" >> $GITHUB_PATH

      - name: Build godot-cpp web library (threads)
        working-directory: src/godot-cpp
        run: scons platform=web target=template_release api_version=4.7 threads=yes

      - name: Compile GDExtension wasm (threaded side module)
        run: |
          # **/bin/ is git-ignored with nothing tracked inside it, so a fresh
          # checkout has no godot/bin/ -> em++ cannot create the output file.
          # BuildWeb.ps1 does this too (New-Item ... godot/bin).
          mkdir -p godot/bin
          # -pthread must match BuildWeb.ps1 and requires godot-cpp to have been
          # built with threads=yes (previous step): the module links against the
          # threaded Godot web template's pthread runtime. Output goes to the
          # canonical name that frogger_arcade.gdextension lists for
          # web.{debug,release}.wasm32.threads, so no .gdextension rewrite is
          # needed any more.
          em++ -pthread -sSIDE_MODULE=1 -sWASM_BIGINT -sSUPPORT_LONGJMP=wasm -O3 -std=c++17 \
            -DWEB_ENABLED -DUNIX_ENABLED \
            -Isrc -Isrc/godot-cpp/include -Isrc/godot-cpp/gen/include -Isrc/godot-cpp/gdextension \
            src/ArcadeSimulation.cpp src/ArcadeSimulationExtension.cpp src/NativeSound.cpp \
            src/Generated/MainProgram.cpp src/Generated/SoundProgram.cpp src/register_types.cpp \
            src/godot-cpp/bin/libgodot-cpp.web.template_release.wasm32.a \
            -o godot/bin/libfrogger_arcade.web.template_release.wasm32.wasm
          cp godot/bin/libfrogger_arcade.web.template_release.wasm32.wasm \
             godot/bin/libfrogger_arcade.web.template_debug.wasm32.wasm

      - name: Export Web preset (threaded, cross-origin isolated)
        run: |
          # GitHub Pages cannot send COOP/COEP, but browsers honour them when a
          # Service Worker supplies them. Godot emits that worker only when
          # progressive_web_app/enabled is on (EditorExportPlatformWeb::_build_pwa
          # is gated on it), and it only injects the headers when
          # ensure_cross_origin_isolation_headers is on. Both are required, and
          # neither is meaningful without variant/thread_support.
          #
          # Done with sed + a git checkout below rather than by editing the
          # committed preset, so your local build stays free of the service
          # worker (it caches aggressively and would hide local changes).
          sed -i 's|^variant/thread_support=.*|variant/thread_support=true|' godot/export_presets.cfg
          # Inserts the COI option directly after the enabled line, keeping it
          # inside [preset.1.options] rather than appending past the section.
          sed -i 's|^progressive_web_app/enabled=.*|progressive_web_app/enabled=true\nprogressive_web_app/ensure_cross_origin_isolation_headers=true|' godot/export_presets.cfg
          mkdir -p builds/web
          ~/godot/Godot_v4.7-stable_linux.x86_64 --headless --path godot \
            --export-release "Web" "$GITHUB_WORKSPACE/builds/web/index.html"
          git -C "$GITHUB_WORKSPACE" checkout -- godot/export_presets.cfg || true
          mkdir -p builds/web/licenses
          cp LICENSE THIRD_PARTY.md builds/web/licenses/
          cp godot/Fonts/*-OFL.txt builds/web/licenses/ || true
          ls builds/web
          # Without this worker the threaded build cannot obtain SharedArrayBuffer
          # on Pages and dies at startup, so fail loudly here instead.
          test -f builds/web/index.service.worker.js || {
            echo "::error::index.service.worker.js missing - threaded build will not start on Pages"; exit 1; }
          # Assert the token was actually substituted. Grepping for the header
          # names would be a false positive: the template ships
          # ensureCrossOriginIsolationHeaders() with those strings regardless,
          # and only the boolean gates the calls to it.
          grep -q 'ENSURE_CROSSORIGIN_ISOLATION_HEADERS = true' builds/web/index.service.worker.js || {
            echo "::error::COI disabled in the service worker - SharedArrayBuffer will be unavailable"; exit 1; }

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: builds/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
