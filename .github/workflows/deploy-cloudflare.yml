name: Deploy to Cloudflare Pages

on:
  push:
    branches:
      - web-release
  workflow_dispatch:

concurrency:
  group: cloudflare-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Deploy Pre-built Web Artifacts
    steps:
      - name: Checkout web artifacts
        uses: actions/checkout@v4

      - name: Verify Web Artifacts
        run: |
          if [ ! -f index.html ]; then
            echo "::error::index.html not found. Ensure this branch or commit contains the exported web artifacts."
            exit 1
          fi
          if [ ! -f _headers ]; then
            echo "::warning::_headers file missing; generating entry-page cache headers..."
            printf "/index.html\n  Cache-Control: no-cache\n/sw.js\n  Cache-Control: no-cache\n" > _headers
          fi

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy . --project-name=frogger-remake --branch=main
